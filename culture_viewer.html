<html lang="ja">
<head>
<meta charset="UTF-8">

<title>EMBERFALL 文化 — 建築・服装・民族・人文・生活</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0908; --fg:#c8bfa8; --muted:#7a7266; --bone:#c8bfa8; --gold:#b08840;
  --panel:rgba(255,255,255,0.04); --border:rgba(176,136,64,0.15);
  --t-arch:#a88858; --t-cloth:#c09070; --t-peop:#90a078; --t-hum:#a878a0; --t-daily:#b09070;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);font-family:'Noto Sans JP',sans-serif;min-height:100vh;line-height:1.65}
a{color:var(--gold);text-decoration:none}
a:hover{text-decoration:underline}

header{padding:1.5rem 1rem 1rem;border-bottom:1px solid var(--border);background:linear-gradient(180deg,rgba(176,136,64,0.08),transparent)}
.hbar{max-width:1400px;margin:0 auto;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:0.5rem}
h1{font-family:'Cinzel',serif;font-weight:500;font-size:1.5rem;letter-spacing:0.18em;color:var(--bone)}
.sub{font-size:0.75rem;color:var(--muted);letter-spacing:0.1em}
.home{font-size:0.75rem;letter-spacing:0.15em}

.tab-bar{max-width:1400px;margin:0 auto;padding:0 0.7rem;display:flex;gap:0;border-bottom:1px solid var(--border);overflow-x:auto}
.tab{padding:0.8rem 1.2rem;background:transparent;border:none;color:var(--muted);font-family:'Cinzel',serif;font-size:0.7rem;letter-spacing:0.2em;cursor:pointer;border-bottom:2px solid transparent;transition:all 0.2s;flex-shrink:0;white-space:nowrap}
.tab .tab-ja{font-family:'Noto Sans JP',sans-serif;font-size:0.7rem;letter-spacing:0.05em;margin-left:0.4rem;opacity:0.6}
.tab:hover{color:var(--bone)}
.tab.active{color:var(--bone)}
.tab.active.arch{border-bottom-color:var(--t-arch)}
.tab.active.cloth{border-bottom-color:var(--t-cloth)}
.tab.active.peop{border-bottom-color:var(--t-peop)}
.tab.active.hum{border-bottom-color:var(--t-hum)}
.tab.active.daily{border-bottom-color:var(--t-daily)}

.controls{max-width:1400px;margin:0 auto;padding:0.8rem 1rem;display:flex;flex-wrap:wrap;gap:0.6rem;align-items:center;border-bottom:1px solid var(--border)}
.search{flex:1;min-width:200px}
.search input{width:100%;padding:0.5rem 0.75rem;background:rgba(0,0,0,0.4);border:1px solid var(--border);color:var(--fg);font-family:inherit;font-size:0.85rem;border-radius:3px}
.search input:focus{outline:none;border-color:var(--gold)}
.pill{padding:0.32rem 0.7rem;background:transparent;border:1px solid var(--border);color:var(--muted);font-family:'Cinzel',serif;font-size:0.58rem;letter-spacing:0.2em;cursor:pointer;border-radius:20px;transition:all 0.15s;text-transform:uppercase}
.pill:hover{color:var(--bone);border-color:var(--gold)}
.pill.active{color:var(--bg);background:var(--gold);border-color:var(--gold)}

.intro{max-width:1400px;margin:0 auto;padding:1rem 1rem 0.5rem;font-size:0.82rem;line-height:1.75;color:var(--fg);opacity:0.85;font-style:italic}

.stats{max-width:1400px;margin:0 auto;padding:0.5rem 1rem;font-size:0.7rem;color:var(--muted);letter-spacing:0.08em}
.stats b{color:var(--bone);font-weight:400}

main{max-width:1400px;margin:0 auto;padding:0.7rem 1rem 3rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:0.9rem}

.card{padding:1.1rem;background:var(--panel);border:1px solid var(--border);border-radius:4px;transition:all 0.15s;position:relative;cursor:pointer;border-left-width:3px}
.card:hover{background:rgba(255,255,255,0.06);border-color:var(--gold)}
.card.read{opacity:0.55}
.card.fav{border-color:var(--gold)}
.card.expanded{background:rgba(255,255,255,0.06);grid-column:1/-1;cursor:default;border-color:var(--gold)}
.card[data-tab="architecture"]{border-left-color:var(--t-arch)}
.card[data-tab="clothing"]{border-left-color:var(--t-cloth)}
.card[data-tab="peoples"]{border-left-color:var(--t-peop)}
.card[data-tab="humanities"]{border-left-color:var(--t-hum)}
.card[data-tab="daily"]{border-left-color:var(--t-daily)}

.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:0.5rem;margin-bottom:0.4rem}
.c-num{font-family:'Cinzel',serif;color:var(--muted);font-size:0.7rem;letter-spacing:0.15em}
.c-tag{font-family:'Cinzel',serif;font-size:0.55rem;letter-spacing:0.18em;padding:0.15rem 0.45rem;border-radius:2px;color:#0a0908;text-transform:uppercase}
.c-tag.arch{background:var(--t-arch)}
.c-tag.cloth{background:var(--t-cloth)}
.c-tag.peop{background:var(--t-peop)}
.c-tag.hum{background:var(--t-hum)}
.c-tag.daily{background:var(--t-daily)}

.c-title{font-family:'Noto Serif JP',serif;font-size:1rem;color:var(--bone);font-weight:500;margin-bottom:0.55rem;line-height:1.35}
.c-hook{font-size:0.82rem;line-height:1.6;padding:0.5rem 0.65rem;background:rgba(176,136,64,0.06);border-left:2px solid var(--gold);border-radius:2px;font-style:italic}
.card:not(.expanded) .c-hook{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

.c-details{display:none;margin-top:0.9rem;padding-top:0.9rem;border-top:1px dashed var(--border);font-size:0.8rem;line-height:1.7}
.card.expanded .c-details{display:block}
.c-details dt{font-family:'Cinzel',serif;font-size:0.62rem;letter-spacing:0.2em;color:var(--gold);margin-top:0.7rem;text-transform:uppercase}
.c-details dd{color:var(--fg);opacity:0.9;margin-top:0.2rem}

.c-memo{margin-top:0.9rem}
.c-memo textarea{width:100%;min-height:55px;background:rgba(0,0,0,0.4);border:1px solid var(--border);color:var(--fg);padding:0.5rem;font-family:inherit;font-size:0.78rem;border-radius:3px;resize:vertical;margin-top:0.3rem}
.c-memo textarea:focus{outline:none;border-color:var(--gold)}
.c-actions{display:flex;gap:0.5rem;margin-top:0.7rem;flex-wrap:wrap}
.c-btn{padding:0.28rem 0.65rem;background:transparent;border:1px solid var(--border);color:var(--muted);font-family:'Cinzel',serif;font-size:0.58rem;letter-spacing:0.2em;cursor:pointer;border-radius:2px}
.c-btn:hover{color:var(--bone);border-color:var(--gold)}
.c-btn.on{color:var(--gold);border-color:var(--gold)}

.empty{text-align:center;padding:3rem;color:var(--muted);font-style:italic;grid-column:1/-1}

@media (max-width:640px){
  h1{font-size:1.1rem}
  .tab{padding:0.7rem 0.8rem;font-size:0.6rem;letter-spacing:0.12em}
  .tab .tab-ja{display:none}
  .grid{grid-template-columns:1fr;gap:0.7rem}
  main{padding:0.7rem}
}
</style>
</head>

    "label": "物語のフック",
    "value": "ただの交換品が、後に誰が誰を守ろうとしたかの証拠になる。"
   }
  ]
 },
 {
  "num": 48,
  "title": "反骨アクセ取引 / *Marché Gris*",
  "tab": "daily",
  "hook": "安い耳飾り一つが、地下組織と学院クラスを繋ぐ合図になる。",
  "fields": [
   {
    "label": "名称",
    "value": "反骨アクセ取引 / *Marché Gris*"
   },
   {
    "label": "場面・時期",
    "value": "夜市、学院祭、外環フリマ、ライブ終演後。"
   },
   {
    "label": "担い手",
    "value": "若者、舞台衣装崩れ、移民二世、地下誌まわりの子たち。"
   },
   {
    "label": "概要",
    "value": "廃材金具、名家礼装の端切れ、無害な模造石、時に禁制品を混ぜたアクセの交換市場。"
   },
   {
    "label": "文化的意味",
    "value": "階級美学を解体し、自分たちの印を自分で作る若者経済。遊びだが、政治の匂いが濃い。"
   },
   {
    "label": "物語のフック",
    "value": "安い耳飾り一つが、地下組織と学院クラスを繋ぐ合図になる。"
   }
  ]
 }
];
const INTROS = {"architecture": "本稿では、行政上の首都 `RACINE` を含む中央旧都圏を文化名として「エンバーリン圏」と呼ぶ。学院生や旧家の会話で「エンバーリン」と言う場合、多くは `RACINE` の旧王冠区、灰燼文庫学院、北台地の旧館群までを含んだ生活圏を指す。", "clothing": "本稿の服飾は、VEXALIAの制度、KROSSの労働、TAKANIの返礼、EMBERLYNの残存格式、そしてBLANCA以後の若者的混成を同時に反映する。衣服は保温や身分表示だけでなく、血統の秘匿、所属の偽装、反抗の暗号にもなる。", "peoples": "本世界の中心はあくまで人間社会であり、エルフやドワーフのような独立した定番ファンタジー種族は存在しない。その代わり、1700年の接触以後に生じた血統差、混成文化、そして「人以外にも起きた変化」が、連邦の人間多様性と生態系を複雑にしている。", "humanities": "本世界の人文学は、魔法をどう呼ぶか、接触をどう意味づけるか、そして誰の記録を「歴史」と認めるかをめぐって成立している。制度側の学問30分野に対し、ここで扱うのはそれを支える思想潮流、文学慣習、言語実践、翻訳文化、批評の地層である。", "daily": "本稿は、七都市の明るい日常と、その裏にある階層・血統・規制の緊張が同時に見えるよう構成した。子ども視点では楽しく、シリーズが進むほど同じ文化要素が別の重さを帯びる。"};
const TABS = [{"id": "architecture", "ja": "建築・都市", "en": "Architecture", "color": "#a88858"}, {"id": "clothing", "ja": "服装・身装", "en": "Clothing", "color": "#c09070"}, {"id": "peoples", "ja": "民族・種族", "en": "Peoples", "color": "#90a078"}, {"id": "humanities", "ja": "人文・思想", "en": "Humanities", "color": "#a878a0"}, {"id": "daily", "ja": "生活・娯楽", "en": "Daily Life", "color": "#b09070"}];

const LS = {
  get(k, def){ try { return JSON.parse(localStorage.getItem('cv_'+k)) ?? def; } catch(e){ return def; } },
  set(k, v){ localStorage.setItem('cv_'+k, JSON.stringify(v)); }
};

let favs = new Set(LS.get('favs', []));
let reads = new Set(LS.get('reads', []));
let memos = LS.get('memos', {});
let expanded = new Set();

let filters = { tab: 'architecture', q: '', fav: false, unread: false, all: false };

// Build tabs
const tabBar = document.getElementById('tabs');
TABS.forEach((t, i) => {
  const b = document.createElement('button');
  b.className = 'tab ' + t.id.substring(0,5);
  if (i === 0) b.classList.add('active');
  b.dataset.tab = t.id;
  b.innerHTML = `◆ ${t.en}<span class="tab-ja">${t.ja}</span>`;
  tabBar.appendChild(b);
  b.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    filters.tab = t.id;
    filters.all = false;
    document.querySelectorAll('.pill[data-filter="all"]').forEach(p => p.classList.remove('active'));
    document.getElementById('intro').textContent = INTROS[t.id] || '';
    render();
  });
});

document.getElementById('intro').textContent = INTROS['architecture'] || '';

const grid = document.getElementById('grid');
const statsEl = document.getElementById('stats');

function getKey(e){ return `${e.tab}-${e.num}`; }

function matches(e){
  if (!filters.all && e.tab !== filters.tab) return false;
  const key = getKey(e);
  if (filters.fav && !favs.has(key)) return false;
  if (filters.unread && reads.has(key)) return false;
  if (filters.q){
    const q = filters.q.toLowerCase();
    const hay = (e.title+' '+e.hook+' '+e.fields.map(f=>f.label+' '+f.value).join(' ')).toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

function render(){
  const list = ENTRIES.filter(matches);
  grid.innerHTML = '';
  if (!list.length){ grid.innerHTML = '<div class="empty">該当なし</div>'; updateStats(list); return; }
  list.forEach(e => {
    const key = getKey(e);
    const card = document.createElement('div');
    const shortTab = {architecture:'arch',clothing:'cloth',peoples:'peop',humanities:'hum',daily:'daily'}[e.tab];
    card.className = 'card' + (reads.has(key)?' read':'') + (favs.has(key)?' fav':'') + (expanded.has(key)?' expanded':'');
    card.dataset.key = key;
    card.dataset.tab = e.tab;
    const memo = memos[key] || '';
    const fieldsHtml = e.fields.filter(f => !f.label.includes('フック')).map(f =>
      `<dt>${f.label}</dt><dd>${f.value}</dd>`
    ).join('');
    card.innerHTML = `
      <div class="card-top">
        <span class="c-num">#${String(e.num).padStart(2,'0')}</span>
        <span class="c-tag ${shortTab}">${TABS.find(t=>t.id===e.tab).en}</span>
      </div>
      <div class="c-title">${e.title}</div>
      <div class="c-hook">${e.hook || ''}</div>
      <div class="c-details">
        <dl>${fieldsHtml}</dl>
        <div class="c-memo">
          <dt style="font-family:'Cinzel',serif;font-size:0.62rem;letter-spacing:0.2em;color:var(--gold);text-transform:uppercase">メモ Memo</dt>
          <textarea data-memo="${key}" placeholder="気になった点・採用決定・削除候補 ...">${memo.replace(/"/g,'&quot;')}</textarea>
        </div>
        <div class="c-actions">
          <button class="c-btn ${favs.has(key)?'on':''}" data-act="fav" data-key="${key}">${favs.has(key)?'♥':'♡'} お気に入り</button>
          <button class="c-btn ${reads.has(key)?'on':''}" data-act="read" data-key="${key}">${reads.has(key)?'✓ 既読':'未読'}</button>
          <button class="c-btn" data-act="collapse" data-key="${key}">閉じる</button>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
  updateStats(list);
}

function updateStats(list){
  statsEl.innerHTML = `表示 <b>${list.length}</b> / 全 <b>${ENTRIES.length}</b> &nbsp;&nbsp; ♥ <b>${favs.size}</b> &nbsp;&nbsp; 既読 <b>${reads.size}</b>`;
}

grid.addEventListener('click', (ev)=>{
  const card = ev.target.closest('.card'); if (!card) return;
  const key = card.dataset.key;
  const act = ev.target.dataset.act;
  if (act === 'fav'){
    if (favs.has(key)) favs.delete(key); else favs.add(key);
    LS.set('favs', [...favs]); render(); ev.stopPropagation(); return;
  }
  if (act === 'read'){
    if (reads.has(key)) reads.delete(key); else reads.add(key);
    LS.set('reads', [...reads]); render(); ev.stopPropagation(); return;
  }
  if (act === 'collapse'){ expanded.delete(key); render(); ev.stopPropagation(); return; }
  if (ev.target.tagName === 'TEXTAREA') return;
  if (expanded.has(key)){ expanded.delete(key); } else { expanded.add(key); reads.add(key); LS.set('reads', [...reads]); }
  render();
});

grid.addEventListener('input', (ev)=>{
  const t = ev.target;
  if (t.tagName === 'TEXTAREA' && t.dataset.memo){
    memos[t.dataset.memo] = t.value;
    LS.set('memos', memos);
  }
});

document.querySelectorAll('.pill[data-filter]').forEach(p=>{
  p.addEventListener('click', ()=>{
    const f = p.dataset.filter;
    filters[f] = !filters[f];
    p.classList.toggle('active', filters[f]);
    render();
  });
});

document.getElementById('q').addEventListener('input', (e)=>{
  filters.q = e.target.value.trim();
  render();
});

render();
</script>

</body>
</html>
