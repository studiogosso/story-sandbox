<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magic Systems Research — ビューア</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0908; --fg:#c8bfa8; --muted:#7a7266; --bone:#c8bfa8; --gold:#b08840;
  --ax1:#c09070; --ax2:#a88858; --ax3:#90a078; --ax4:#8890a0; --ax5:#a878a0; --ax6:#b08060; --ax7:#a07070; --ax8:#709098;
  --panel:rgba(255,255,255,0.04); --border:rgba(176,136,64,0.15);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);font-family:'Noto Sans JP',sans-serif;min-height:100vh;line-height:1.6}
a{color:var(--gold);text-decoration:none}
a:hover{text-decoration:underline}

header{padding:1.5rem 1rem 1rem;border-bottom:1px solid var(--border);background:linear-gradient(180deg,rgba(176,136,64,0.08),transparent)}
.hbar{max-width:1400px;margin:0 auto;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:0.5rem}
h1{font-family:'Cinzel',serif;font-weight:400;font-size:1.4rem;letter-spacing:0.15em;color:var(--bone)}
.sub{font-size:0.75rem;color:var(--muted);letter-spacing:0.1em}
.home{font-size:0.75rem;letter-spacing:0.15em}

.controls{max-width:1400px;margin:0 auto;padding:1rem;display:flex;flex-wrap:wrap;gap:0.75rem;align-items:center;border-bottom:1px solid var(--border)}
.search{flex:1;min-width:200px}
.search input{width:100%;padding:0.5rem 0.75rem;background:rgba(0,0,0,0.4);border:1px solid var(--border);color:var(--fg);font-family:inherit;font-size:0.85rem;border-radius:3px}
.search input:focus{outline:none;border-color:var(--gold)}
.pill{padding:0.4rem 0.8rem;background:transparent;border:1px solid var(--border);color:var(--muted);font-family:'Cinzel',serif;font-size:0.65rem;letter-spacing:0.2em;cursor:pointer;border-radius:20px;transition:all 0.15s;text-transform:uppercase}
.pill:hover{color:var(--bone);border-color:var(--gold)}
.pill.active{color:var(--bg);background:var(--gold);border-color:var(--gold)}
.pill.axis1.active{background:var(--ax1);border-color:var(--ax1)}
.pill.axis2.active{background:var(--ax2);border-color:var(--ax2)}
.pill.axis3.active{background:var(--ax3);border-color:var(--ax3)}
.pill.axis4.active{background:var(--ax4);border-color:var(--ax4)}
.pill.axis5.active{background:var(--ax5);border-color:var(--ax5)}
.pill.axis6.active{background:var(--ax6);border-color:var(--ax6)}
.pill.axis7.active{background:var(--ax7);border-color:var(--ax7)}
.pill.axis8.active{background:var(--ax8);border-color:var(--ax8)}

.stats{max-width:1400px;margin:0 auto;padding:0.6rem 1rem;font-size:0.7rem;color:var(--muted);letter-spacing:0.08em;display:flex;gap:1.5rem;flex-wrap:wrap}
.stats b{color:var(--bone);font-weight:400}

main{max-width:1400px;margin:0 auto;padding:1rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1rem}

.card{padding:1.1rem;background:var(--panel);border:1px solid var(--border);border-radius:4px;transition:all 0.15s;position:relative;cursor:pointer}
.card:hover{background:rgba(255,255,255,0.06);border-color:var(--gold)}
.card.read{opacity:0.6}
.card.fav{border-color:var(--gold);box-shadow:inset 0 0 0 1px rgba(176,136,64,0.3)}
.card.expanded{background:rgba(255,255,255,0.06);grid-column:1/-1;cursor:default;border-color:var(--gold)}

.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:0.5rem;margin-bottom:0.4rem}
.c-num{font-family:'Cinzel',serif;color:var(--muted);font-size:0.75rem;letter-spacing:0.15em}
.c-badges{display:flex;gap:0.3rem;flex-wrap:wrap}
.badge{font-family:'Cinzel',serif;font-size:0.55rem;letter-spacing:0.15em;padding:0.15rem 0.4rem;border-radius:2px;background:rgba(0,0,0,0.3);color:var(--muted);border:1px solid transparent}
.badge.axis1{background:rgba(192,144,112,0.15);color:var(--ax1)}
.badge.axis2{background:rgba(168,136,88,0.15);color:var(--ax2)}
.badge.axis3{background:rgba(144,160,120,0.15);color:var(--ax3)}
.badge.axis4{background:rgba(136,144,160,0.15);color:var(--ax4)}
.badge.axis5{background:rgba(168,120,160,0.15);color:var(--ax5)}
.badge.axis6{background:rgba(176,128,96,0.15);color:var(--ax6)}
.badge.axis7{background:rgba(160,112,112,0.15);color:var(--ax7)}
.badge.axis8{background:rgba(112,144,152,0.15);color:var(--ax8)}
.badge.star{background:rgba(176,136,64,0.2);color:var(--gold)}
.badge.mainstream{background:rgba(192,68,68,0.15);color:#c04444}

.c-title{font-family:'Noto Serif JP',serif;font-size:0.95rem;color:var(--bone);font-weight:500;margin-bottom:0.25rem;line-height:1.35}
.c-meta{font-size:0.7rem;color:var(--muted);margin-bottom:0.5rem}
.c-core{font-size:0.8rem;line-height:1.55;color:var(--fg);opacity:0.92}
.card:not(.expanded) .c-core{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

.c-details{display:none;margin-top:0.9rem;padding-top:0.9rem;border-top:1px dashed var(--border);font-size:0.78rem;line-height:1.6}
.card.expanded .c-details{display:block}
.c-details h4{font-family:'Cinzel',serif;font-size:0.7rem;letter-spacing:0.2em;color:var(--gold);margin:0.8rem 0 0.25rem;text-transform:uppercase}
.c-details p{color:var(--fg);opacity:0.88}
.c-memo{margin-top:0.8rem}
.c-memo textarea{width:100%;min-height:60px;background:rgba(0,0,0,0.4);border:1px solid var(--border);color:var(--fg);padding:0.5rem;font-family:inherit;font-size:0.78rem;border-radius:3px;resize:vertical}
.c-memo textarea:focus{outline:none;border-color:var(--gold)}

.c-actions{display:flex;gap:0.5rem;margin-top:0.6rem;flex-wrap:wrap}
.c-btn{padding:0.3rem 0.7rem;background:transparent;border:1px solid var(--border);color:var(--muted);font-family:'Cinzel',serif;font-size:0.6rem;letter-spacing:0.2em;cursor:pointer;border-radius:2px;transition:all 0.1s}
.c-btn:hover{color:var(--bone);border-color:var(--gold)}
.c-btn.on{color:var(--gold);border-color:var(--gold)}

.empty{grid-column:1/-1;text-align:center;padding:3rem;color:var(--muted);font-style:italic}

@media (max-width:640px){
  h1{font-size:1.1rem}
  .controls{padding:0.7rem}
  main{padding:0.7rem;gap:0.7rem;grid-template-columns:1fr}
}
</style>
</head>
<body>

<header>
  <div class="hbar">
    <div>
      <h1>Magic Systems Research</h1>

</header>

<div class="controls" id="axis-filters">

</div>

<div class="stats" id="stats"></div>

<main id="grid"></main>

 {

  "culture": "メラネシア（パプアニューギニア）",
  "era": "前近代〜20世紀記録",
  "mainstream": false,
  "star": false,
  "core": "農耕開始前の12時間にわたる仮面舞踊儀礼「イデー」は、「石（サゴヤシの根元の石）と人間と稲荷の精霊」の三者が接触・融合する場として機能する。石は毎年参加する儀礼メンバーとして扱われる。",
  "ref": "Alfred Gell『Metamorphosis of the Cassowaries: Umeda Society, Language and Ritual』（1975; Athlone Press）",

 }
];
const AXES = {"1": "古代〜近世の魔術・神秘学", "2": "錬金術の各文化派", "3": "対話型魔法の伝統", "4": "加工型魔法の伝統", "5": "量として扱える魔力観", "6": "遺伝・血統魔法の古典", "7": "魔法規制・魔女狩り制度史", "8": "忘れられた地域"};

// localStorage helpers
const LS = {
  get(k, def){ try { return JSON.parse(localStorage.getItem('mv_'+k)) ?? def; } catch(e){ return def; } },
  set(k, v){ localStorage.setItem('mv_'+k, JSON.stringify(v)); }
};

let favs = new Set(LS.get('favs', []));
let reads = new Set(LS.get('reads', []));
let memos = LS.get('memos', {});
let expanded = new Set();

let filters = { axis: 0, q: '', star: false, fav: false, unread: false, mainstream_off: false };

// Build axis filter pills
const axisBar = document.getElementById('axis-filters');
Object.entries(AXES).forEach(([k, name]) => {
  const b = document.createElement('button');
  b.className = 'pill axis-pill axis' + k;
  b.dataset.axis = k;
  b.textContent = k + '. ' + name;
  axisBar.appendChild(b);
});

// Render
const grid = document.getElementById('grid');
const statsEl = document.getElementById('stats');

function matches(e){
  if (filters.axis && e.axis !== filters.axis) return false;
  if (filters.star && !e.star) return false;
  if (filters.fav && !favs.has(e.n)) return false;
  if (filters.unread && reads.has(e.n)) return false;
  if (filters.mainstream_off && e.mainstream) return false;
  if (filters.q){
    const q = filters.q.toLowerCase();
    const hay = (e.titleJa+' '+e.nameFull+' '+e.culture+' '+e.era+' '+e.core+' '+e.ref+' '+e.app+' '+e.forgot).toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

function render(){
  const list = ENTRIES.filter(matches);
  grid.innerHTML = '';
  if (!list.length){ grid.innerHTML = '<div class="empty">該当なし</div>'; updateStats(list); return; }
  list.forEach(e => {
    const card = document.createElement('div');
    card.className = 'card' + (reads.has(e.n)?' read':'') + (favs.has(e.n)?' fav':'') + (expanded.has(e.n)?' expanded':'');
    card.dataset.n = e.n;
    const memo = memos[e.n] || '';
    card.innerHTML = `
      <div class="card-top">
        <span class="c-num">#${String(e.n).padStart(2,'0')}</span>
        <div class="c-badges">
          ${e.star?'<span class="badge star">★</span>':''}
          ${e.mainstream?'<span class="badge mainstream">有名</span>':''}
          <span class="badge axis${e.axis}">AX${e.axis}</span>
        </div>
      </div>
      <div class="c-title">${e.titleJa}</div>
      <div class="c-meta">${e.nameFull} — ${e.culture} / ${e.era}</div>
      <div class="c-core">${e.core}</div>
      <div class="c-details">
        <h4>主要文献</h4><p>${e.ref}</p>
        <h4>世界観への応用</h4><p>${e.app}</p>
        <h4>忘れられた理由</h4><p>${e.forgot}</p>
        <div class="c-memo">
          <h4>メモ</h4>
          <textarea data-memo="${e.n}" placeholder="気になった点・引用したい一節 ...">${memo.replace(/"/g,'&quot;')}</textarea>
        </div>
        <div class="c-actions">
          <button class="c-btn ${favs.has(e.n)?'on':''}" data-act="fav" data-n="${e.n}">${favs.has(e.n)?'♥ お気に入り':'♡ お気に入り'}</button>
          <button class="c-btn ${reads.has(e.n)?'on':''}" data-act="read" data-n="${e.n}">${reads.has(e.n)?'✓ 既読':'未読'}</button>
          <button class="c-btn" data-act="collapse" data-n="${e.n}">閉じる</button>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
  updateStats(list);
}

function updateStats(list){
  const all = ENTRIES.length;
  const shown = list.length;
  const fc = favs.size;
  const rc = reads.size;
  statsEl.innerHTML = `表示 <b>${shown}</b> / 全 <b>${all}</b> &nbsp;&nbsp; ♥ <b>${fc}</b> &nbsp;&nbsp; 既読 <b>${rc}</b>`;
}

// Interactions
grid.addEventListener('click', (ev)=>{
  const card = ev.target.closest('.card'); if (!card) return;
  const n = parseInt(card.dataset.n);
  const act = ev.target.dataset.act;
  if (act === 'fav'){
    if (favs.has(n)) favs.delete(n); else favs.add(n);
    LS.set('favs', [...favs]); render(); ev.stopPropagation(); return;
  }
  if (act === 'read'){
    if (reads.has(n)) reads.delete(n); else reads.add(n);
    LS.set('reads', [...reads]); render(); ev.stopPropagation(); return;
  }
  if (act === 'collapse'){
    expanded.delete(n); render(); ev.stopPropagation(); return;
  }
  if (ev.target.tagName === 'TEXTAREA') return;
  // toggle expand
  if (expanded.has(n)){ expanded.delete(n); } else { expanded.add(n); reads.add(n); LS.set('reads', [...reads]); }
  render();
});

grid.addEventListener('input', (ev)=>{
  const t = ev.target;
  if (t.tagName === 'TEXTAREA' && t.dataset.memo){
    const n = parseInt(t.dataset.memo);
    memos[n] = t.value;
    LS.set('memos', memos);
  }
});

// Filter pills
document.querySelectorAll('.axis-pill').forEach(p=>{
  p.addEventListener('click', ()=>{
    const a = parseInt(p.dataset.axis);
    filters.axis = filters.axis === a ? 0 : a;
    document.querySelectorAll('.axis-pill').forEach(x => x.classList.toggle('active', parseInt(x.dataset.axis) === filters.axis));
    if (filters.axis === 0) document.querySelector('.axis-pill[data-axis="0"]').classList.add('active');
    render();
  });
});
document.querySelector('.axis-pill[data-axis="0"]').classList.add('active');

document.querySelectorAll('.pill[data-filter]').forEach(p=>{
  p.addEventListener('click', ()=>{
    const f = p.dataset.filter;
    filters[f] = !filters[f];
    p.classList.toggle('active', filters[f]);
    render();
  });
});

document.getElementById('q').addEventListener('input', (e)=>{
  filters.q = e.target.value.trim();
  render();
});

render();
</script>
