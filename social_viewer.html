<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Fabric — 名家外社会の織物</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0908; --fg:#c8bfa8; --muted:#7a7266; --bone:#c8bfa8; --gold:#b08840;
  --panel:rgba(255,255,255,0.04); --border:rgba(176,136,64,0.15);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);font-family:'Noto Sans JP',sans-serif;min-height:100vh;line-height:1.6}
a{color:var(--gold);text-decoration:none}
a:hover{text-decoration:underline}

header{padding:1.5rem 1rem 1rem;border-bottom:1px solid var(--border);background:linear-gradient(180deg,rgba(176,136,64,0.08),transparent)}
.hbar{max-width:1400px;margin:0 auto;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:0.5rem}
h1{font-family:'Cinzel',serif;font-weight:400;font-size:1.4rem;letter-spacing:0.15em;color:var(--bone)}
.sub{font-size:0.75rem;color:var(--muted);letter-spacing:0.1em}
.home{font-size:0.75rem;letter-spacing:0.15em}

.tab-bar{max-width:1400px;margin:0 auto;padding:0 1rem;display:flex;gap:0;border-bottom:1px solid var(--border)}
.tab{padding:0.9rem 1.4rem;background:transparent;border:none;color:var(--muted);font-family:'Cinzel',serif;font-size:0.75rem;letter-spacing:0.25em;cursor:pointer;border-bottom:2px solid transparent;transition:all 0.2s}
.tab:hover{color:var(--bone)}
.tab.active{color:var(--bone);border-bottom-color:var(--gold)}

.controls{max-width:1400px;margin:0 auto;padding:1rem;display:flex;flex-wrap:wrap;gap:0.7rem;align-items:center;border-bottom:1px solid var(--border)}
.search{flex:1;min-width:200px}
.search input{width:100%;padding:0.5rem 0.75rem;background:rgba(0,0,0,0.4);border:1px solid var(--border);color:var(--fg);font-family:inherit;font-size:0.85rem;border-radius:3px}
.search input:focus{outline:none;border-color:var(--gold)}
.pill{padding:0.35rem 0.75rem;background:transparent;border:1px solid var(--border);color:var(--muted);font-family:'Cinzel',serif;font-size:0.6rem;letter-spacing:0.2em;cursor:pointer;border-radius:20px;transition:all 0.15s;text-transform:uppercase}
.pill:hover{color:var(--bone);border-color:var(--gold)}
.pill.active{color:var(--bg);background:var(--gold);border-color:var(--gold)}

.stats{max-width:1400px;margin:0 auto;padding:0.6rem 1rem;font-size:0.7rem;color:var(--muted);letter-spacing:0.08em;display:flex;gap:1.5rem;flex-wrap:wrap}
.stats b{color:var(--bone);font-weight:400}

main{max-width:1400px;margin:0 auto;padding:1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:0.8rem}

.cat-intro{grid-column:1/-1;padding:1rem 1.2rem;background:rgba(176,136,64,0.05);border-left:3px solid var(--gold);border-radius:3px;margin-bottom:0.5rem;font-size:0.85rem;line-height:1.7;color:var(--fg);opacity:0.9}
.cat-intro h3{font-family:'Cinzel',serif;font-size:0.8rem;letter-spacing:0.2em;color:var(--gold);margin-bottom:0.5rem}

.card{padding:1rem;background:var(--panel);border:1px solid var(--border);border-radius:4px;transition:all 0.15s;position:relative;cursor:pointer;border-left-width:3px}
.card:hover{background:rgba(255,255,255,0.06);border-color:var(--gold)}
.card.read{opacity:0.6}
.card.fav{border-color:var(--gold)}
.card.expanded{background:rgba(255,255,255,0.06);grid-column:1/-1;cursor:default;border-color:var(--gold);opacity:1}

.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:0.5rem;margin-bottom:0.3rem}
.c-num{font-family:'Cinzel',serif;color:var(--muted);font-size:0.7rem;letter-spacing:0.15em}
.c-cat{font-family:'Cinzel',serif;font-size:0.55rem;letter-spacing:0.2em;padding:0.15rem 0.4rem;border-radius:2px;color:#0a0908;font-weight:600}

.c-title{font-family:'Noto Serif JP',serif;font-size:0.95rem;color:var(--bone);font-weight:500;line-height:1.3;margin-bottom:0.1rem}
.c-orig{font-style:italic;color:var(--muted);font-size:0.7rem;margin-bottom:0.5rem}
.c-hook{font-size:0.78rem;line-height:1.55;padding:0.4rem 0.55rem;background:rgba(176,136,64,0.06);border-left:2px solid var(--gold);border-radius:2px}

.c-details{display:none;margin-top:0.8rem;padding-top:0.8rem;border-top:1px dashed var(--border);font-size:0.78rem;line-height:1.65}
.card.expanded .c-details{display:block}
.c-details dt{font-family:'Cinzel',serif;font-size:0.6rem;letter-spacing:0.2em;color:var(--gold);margin-top:0.6rem;text-transform:uppercase}
.c-details dd{color:var(--fg);opacity:0.9;margin-top:0.15rem}
.c-memo{margin-top:0.8rem}
.c-memo textarea{width:100%;min-height:50px;background:rgba(0,0,0,0.4);border:1px solid var(--border);color:var(--fg);padding:0.5rem;font-family:inherit;font-size:0.76rem;border-radius:3px;resize:vertical;margin-top:0.3rem}
.c-memo textarea:focus{outline:none;border-color:var(--gold)}
.c-actions{display:flex;gap:0.4rem;margin-top:0.6rem;flex-wrap:wrap}
.c-btn{padding:0.25rem 0.6rem;background:transparent;border:1px solid var(--border);color:var(--muted);font-family:'Cinzel',serif;font-size:0.55rem;letter-spacing:0.2em;cursor:pointer;border-radius:2px}
.c-btn:hover{color:var(--bone);border-color:var(--gold)}
.c-btn.on{color:var(--gold);border-color:var(--gold)}

.empty{text-align:center;padding:3rem;color:var(--muted);font-style:italic}

/* Verbs view */
.verbs-view{max-width:1200px;margin:0 auto;padding:1rem}
.verbs-intro{padding:1.2rem;background:rgba(176,136,64,0.05);border-left:3px solid var(--gold);border-radius:3px;margin-bottom:1.5rem;font-size:0.88rem;line-height:1.7}
.verb-section{margin-bottom:2rem}
.verb-section-title{font-family:'Cinzel',serif;font-size:0.85rem;letter-spacing:0.25em;color:var(--gold);padding-bottom:0.5rem;border-bottom:1px solid var(--border);margin-bottom:1rem}
.verbs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:0.8rem}
.verb-card{padding:0.9rem 1rem;background:var(--panel);border:1px solid var(--border);border-radius:4px}
.verb-card h4{font-family:'Noto Serif JP',serif;font-size:0.9rem;color:var(--bone);margin-bottom:0.3rem}
.verb-card .v-verb{font-family:'Cinzel',serif;font-size:0.75rem;color:var(--gold);letter-spacing:0.05em;margin-bottom:0.5rem;line-height:1.5}
.verb-card .v-def{font-size:0.78rem;line-height:1.55;margin-bottom:0.4rem}
.verb-card .v-conf{font-size:0.72rem;color:var(--muted);font-style:italic;line-height:1.5;border-top:1px dashed var(--border);padding-top:0.4rem}
.verb-card .v-conf::before{content:"⚔ ";color:var(--gold);font-style:normal}

.belts-block{padding:1.2rem;background:rgba(176,136,64,0.04);border:1px solid var(--border);border-radius:3px;margin-top:2rem;font-size:0.85rem;line-height:1.75;white-space:pre-wrap}
.summary-block{padding:1.2rem;background:rgba(176,136,64,0.08);border-left:3px solid var(--gold);border-radius:3px;margin-top:1.5rem;font-size:0.9rem;line-height:1.75}

.view{display:none}
.view.active{display:block}

@media (max-width:640px){
  h1{font-size:1.05rem}
  .controls{padding:0.7rem}
  .grid,.verbs-grid{grid-template-columns:1fr;gap:0.7rem}
  main,.verbs-view{padding:0.7rem}
  .tab{padding:0.7rem 0.9rem;font-size:0.65rem;letter-spacing:0.15em}
}
</style>
</head>
<body>

<header>
  <div class="hbar">
    <div>
      <h1>Social Fabric</h1>
      <div class="sub">名家外社会の織物 — 200集団 × 10カテゴリ + 66動詞地図</div>

<div class="view active" id="view-fabric">

    <button class="pill cat-pill" data-cat="0">ALL</button>
  </div>

  <div class="controls" id="magic-filters">
    <span style="font-size:0.7rem;color:var(--muted);letter-spacing:0.1em;margin-right:0.3rem">MAGIC</span>
    <button class="pill mag-pill" data-mag="0">ALL</button>
    <button class="pill mag-pill" data-mag="持つ">持つ</button>
    <button class="pill mag-pill" data-mag="持たない">持たない</button>
    <button class="pill mag-pill" data-mag="問わない">問わない</button>
  </div>

  <div class="stats" id="stats"></div>
  <main><div class="grid" id="grid"></div></main>
</div>

<!-- Verbs view -->
<div class="view" id="view-verbs">
  <div class="verbs-view">
    <div class="verbs-intro" id="verbs-intro"></div>
    <div id="verb-sections"></div>
    <div class="belts-block" id="belts-block"></div>
    <div class="summary-block" id="summary-block"></div>
  </div>
</div>

const grid = document.getElementById('grid');
const statsEl = document.getElementById('stats');

function matches(e){
  if (filters.cat !== '0' && e.cat !== filters.cat) return false;
  if (filters.mag !== '0' && e.magic !== filters.mag) return false;
  if (filters.fav && !favs.has(e.id)) return false;
  if (filters.unread && reads.has(e.id)) return false;
  if (filters.q){
    const q = filters.q.toLowerCase();
    const hay = (e.nameJa+' '+e.nameOrig+' '+e.composition+' '+e.magic+' '+e.families+' '+e.politics+' '+e.location+' '+e.hook).toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

function render(){
  const list = ENTRIES.filter(matches);
  grid.innerHTML = '';
  if (!list.length){ grid.innerHTML = '<div class="empty">該当なし</div>'; updateStats(list); return; }

  // group by cat when not filtered to single cat
  let currentCat = '';
  list.forEach(e => {
    if (filters.cat === '0' && e.cat !== currentCat){
      const intro = document.createElement('div');
      intro.className = 'cat-intro';
      intro.innerHTML = `<h3>${e.cat}. ${CATEGORIES[e.cat]}</h3><div>${CAT_INTROS[e.cat] || ''}</div>`;
      intro.style.borderLeftColor = CAT_COLORS[e.cat];
      grid.appendChild(intro);
      currentCat = e.cat;
    }
    const card = document.createElement('div');
    card.className = 'card' + (reads.has(e.id)?' read':'') + (favs.has(e.id)?' fav':'') + (expanded.has(e.id)?' expanded':'');
    card.dataset.id = e.id;
    card.style.borderLeftColor = CAT_COLORS[e.cat];
    const memo = memos[e.id] || '';
    card.innerHTML = `
      <div class="card-top">
        <span class="c-num">${e.id}</span>
        <span class="c-cat" style="background:${CAT_COLORS[e.cat]}">${e.cat}</span>
      </div>
      <div class="c-title">${e.nameJa}</div>
      <div class="c-orig">${e.nameOrig}</div>
      <div class="c-hook">${e.hook}</div>
      <div class="c-details">
        <dt>構成人口・階層</dt><dd>${e.composition}</dd>
        <dt>魔力との関係</dt><dd>${e.magic}</dd>
        <dt>4名家との関係</dt><dd>${e.families}</dd>
        <dt>政治的立場</dt><dd>${e.politics}</dd>
        <dt>主要拠点・地域</dt><dd>${e.location}</dd>
        <dl class="c-memo">
          <dt>メモ</dt>
          <textarea data-memo="${e.id}" placeholder="採用/保留/削除・配置アイデア ...">${memo.replace(/"/g,'&quot;')}</textarea>
        </dl>
        <div class="c-actions">
          <button class="c-btn ${favs.has(e.id)?'on':''}" data-act="fav" data-id="${e.id}">${favs.has(e.id)?'♥':'♡'} 推し</button>
          <button class="c-btn ${reads.has(e.id)?'on':''}" data-act="read" data-id="${e.id}">${reads.has(e.id)?'✓ 既読':'未読'}</button>
          <button class="c-btn" data-act="collapse" data-id="${e.id}">閉じる</button>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
  updateStats(list);
}

function updateStats(list){
  statsEl.innerHTML = `表示 <b>${list.length}</b> / 全 <b>${ENTRIES.length}</b> &nbsp;&nbsp; ♥ <b>${favs.size}</b> &nbsp;&nbsp; 既読 <b>${reads.size}</b>`;
}

grid.addEventListener('click', (ev)=>{
  const card = ev.target.closest('.card'); if (!card) return;
  const id = card.dataset.id;
  const act = ev.target.dataset.act;
  if (act === 'fav'){
    if (favs.has(id)) favs.delete(id); else favs.add(id);
    LS.set('favs', [...favs]); render(); ev.stopPropagation(); return;
  }
  if (act === 'read'){
    if (reads.has(id)) reads.delete(id); else reads.add(id);
    LS.set('reads', [...reads]); render(); ev.stopPropagation(); return;
  }
  if (act === 'collapse'){ expanded.delete(id); render(); ev.stopPropagation(); return; }
  if (ev.target.tagName === 'TEXTAREA') return;
  if (expanded.has(id)){ expanded.delete(id); } else { expanded.add(id); reads.add(id); LS.set('reads', [...reads]); }
  render();
});

grid.addEventListener('input', (ev)=>{
  const t = ev.target;
  if (t.tagName === 'TEXTAREA' && t.dataset.memo){
    memos[t.dataset.memo] = t.value;
    LS.set('memos', memos);
  }
});

document.querySelectorAll('.cat-pill').forEach(p=>{
  p.addEventListener('click', ()=>{
    const c = p.dataset.cat;
    filters.cat = filters.cat === c ? '0' : c;
    document.querySelectorAll('.cat-pill').forEach(x => x.classList.toggle('active', x.dataset.cat === filters.cat));
    if (filters.cat === '0') document.querySelector('.cat-pill[data-cat="0"]').classList.add('active');
    render();
  });
});
document.querySelector('.cat-pill[data-cat="0"]').classList.add('active');

document.querySelectorAll('.mag-pill').forEach(p=>{
  p.addEventListener('click', ()=>{
    const m = p.dataset.mag;
    filters.mag = filters.mag === m ? '0' : m;
    document.querySelectorAll('.mag-pill').forEach(x => x.classList.toggle('active', x.dataset.mag === filters.mag));
    if (filters.mag === '0') document.querySelector('.mag-pill[data-mag="0"]').classList.add('active');
    render();
  });
});
document.querySelector('.mag-pill[data-mag="0"]').classList.add('active');

document.querySelectorAll('.pill[data-filter]').forEach(p=>{
  p.addEventListener('click', ()=>{
    const f = p.dataset.filter;
    filters[f] = !filters[f];
    p.classList.toggle('active', filters[f]);
    render();
  });
});

document.getElementById('q').addEventListener('input', (e)=>{
  filters.q = e.target.value.trim();
  render();
});

render();
